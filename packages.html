<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="asterOS packages">
    <title>Packages | asterOS</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="wrapper">
        <header id="header">
            <div class="logo">
                <a href="/">asterOS</a>
            </div>
            <input type="checkbox" id="menu-toggle-cb">
            <label id="menu-toggle" for="menu-toggle-cb">
                <s class="bar"></s><s class="bar"></s><s class="bar"></s>
            </label>
            <div class="menu-wrapper">
                <nav class="menu-local">
                    <ul>
                        <li><a href="index.html#about">About</a></li>
                        <li><a href="index.html#download">Downloads</a></li>
                        <li><a href="index.html#changes">Changes</a></li>
                        <li><a href="packages.html">Packages</a></li>
                        <li><a href="https://github.com/ast-os" target="_blank" rel="noopener">Git</a></li>
                        <li><a href="#">Docs</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <div id="content">
            <div class="pure-g">
                <div class="pure-u-1">
                    <div class="l-box">
                        <h2>Packages</h2>
                        <p>
                            Packages are read from the recipes in
                            <a href="https://github.com/ast-os/ast-recipes" target="_blank" rel="noopener">ast-recipes</a>.
                            asterOS is source-based: each package is built from its recipe.
                        </p>

                        <div class="pkg-search">
                            <input type="search" id="pkg-search" placeholder="Search packages" aria-label="Search packages" autocomplete="off" disabled>
                        </div>

                        <div id="pkg-status" class="pkg-status"></div>
                        <div id="pkg-list"></div>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            &copy; 2026 asterOS Development Team
        </footer>
    </div>

    <script>
    (function () {
        const OWNER_REPO = "ast-os/ast-recipes";
        const BRANCH = "main";
        const RAW = "https://raw.githubusercontent.com/" + OWNER_REPO + "/" + BRANCH + "/";
        const BLOB = "https://github.com/" + OWNER_REPO + "/blob/" + BRANCH + "/";
        const TREE = "https://api.github.com/repos/" + OWNER_REPO + "/git/trees/" + BRANCH + "?recursive=1";

        const statusEl = document.getElementById("pkg-status");
        const listEl = document.getElementById("pkg-list");

        function setStatus(msg, isError) {
            statusEl.textContent = msg;
            statusEl.className = "pkg-status" + (isError ? " error" : "");
        }

        function esc(t) {
            return String(t).replace(/[&<>"]/g, function (c) {
                return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
            });
        }

        // Reads the [package] table of a recipe (simple string and number values)
        function parseRecipe(text) {
            const pkg = { name: "", version: "", revision: "", description: "", license: "" };
            let inPackage = false;
            text.split(/\r?\n/).forEach(function (raw) {
                const line = raw.trim();
                if (!line || line.startsWith("#")) return;
                const table = line.match(/^\[([^\]]+)\]$/);
                if (table) {
                    inPackage = table[1].trim() === "package";
                    return;
                }
                if (!inPackage) return;
                const kv = line.match(/^(\w+)\s*=\s*(.+)$/);
                if (!kv || !(kv[1] in pkg)) return;
                let val = kv[2].trim();
                if (val.startsWith('"') && val.endsWith('"')) {
                    val = val.slice(1, -1).replace(/\\"/g, '"');
                }
                pkg[kv[1]] = val;
            });
            return pkg;
        }

        let all = [];
        const searchEl = document.getElementById("pkg-search");

        function applySearch() {
            const q = searchEl.value.trim().toLowerCase();
            const shown = !q ? all : all.filter(function (p) {
                return p.name.toLowerCase().indexOf(q) !== -1 ||
                    p.description.toLowerCase().indexOf(q) !== -1;
            });
            if (!shown.length) {
                setStatus("No packages match \u201c" + searchEl.value.trim() + "\u201d.");
                listEl.innerHTML = "";
                return;
            }
            setStatus(q ? shown.length + " of " + all.length + " package(s)"
                        : all.length + " package(s) in " + OWNER_REPO);
            render(shown);
        }

        searchEl.addEventListener("input", applySearch);

        function render(pkgs) {
            let html = '<table class="pkg-table"><thead><tr>' +
                "<th>Package</th><th>Version</th><th>Description</th><th>License</th><th></th>" +
                "</tr></thead><tbody>";
            pkgs.forEach(function (p) {
                const ver = p.version + (p.revision ? "-" + p.revision : "");
                html += "<tr>" +
                    "<td><strong>" + esc(p.name) + "</strong></td>" +
                    "<td><code>" + esc(ver) + "</code></td>" +
                    "<td>" + esc(p.description || "—") + "</td>" +
                    "<td>" + esc(p.license || "—") + "</td>" +
                    '<td class="pkg-actions"><a href="' + esc(BLOB + p.path) + '" target="_blank" rel="noopener">recipe</a></td>' +
                    "</tr>";
            });
            listEl.innerHTML = html + "</tbody></table>";
        }

        function load() {
            setStatus("Loading recipes …");
            fetch(TREE)
                .then(function (res) {
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    return res.json();
                })
                .then(function (tree) {
                    const paths = tree.tree.map(function (e) { return e.path; }).filter(function (p) {
                        return /^recipes\/[^\/]+\/[^\/]+\.recipe\.toml$/.test(p);
                    });
                    return Promise.all(paths.map(function (path) {
                        return fetch(RAW + path)
                            .then(function (res) { return res.ok ? res.text() : ""; })
                            .then(function (text) {
                                const p = parseRecipe(text);
                                p.path = path;
                                if (!p.name) p.name = path.split("/")[1];
                                return p;
                            })
                            .catch(function () { return null; });
                    }));
                })
                .then(function (pkgs) {
                    pkgs = pkgs.filter(Boolean);
                    if (!pkgs.length) {
                        setStatus("No recipes found.", true);
                        return;
                    }
                    pkgs.sort(function (a, b) { return a.name.localeCompare(b.name); });
                    all = pkgs;
                    searchEl.disabled = false;
                    applySearch();
                })
                .catch(function () {
                    setStatus("Failed to gather information.", true);
                    listEl.innerHTML = "";
                });
        }

        load();
    })();
    </script>
</body>
</html>
